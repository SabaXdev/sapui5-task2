# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: axalimoduli
type: application
server:
  customMiddleware:
    - name: sap-fe-mockserver
      beforeMiddleware: csp
      configuration:
        mountPath: /
        services:
          - urlPath: /V2/OData/OData.svc
            metadataPath: ./webapp/localService/metadataV2.xml
            mockdataPath: ./webapp/localService/mockdataV2
            generateMockData: false
          - urlPath: /V4/OData/OData.svc
            metadataPath: ./webapp/localService/metadataV4.xml
            mockdataPath: ./webapp/localService/mockdataV4
            generateMockData: false
        annotations: []
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_horizon
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
