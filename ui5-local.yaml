# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: axalimoduli
type: application
framework:
  name: SAPUI5
  version: 1.153.0
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ushell
    - name: themelib_sap_horizon
server:
  customMiddleware:
    - name: sap-fe-mockserver
      beforeMiddleware: compression
      configuration:
        services:
          - urlPath: /odata/V2/ODataDemo
            metadataPath: ./webapp/localService/metadataV2.xml
            mockdataPath: ./webapp/localService/mockdataV2
          - urlPath: /odata/V4/ODataDemo
            metadataPath: ./webapp/localService/metadataV4.xml
            mockdataPath: ./webapp/localService/mockdataV4
            generateMockData: true
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_horizon
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false # If set to true, certificate errors will be ignored. E.g. self-signed certificates will be accepted
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
